########################
# OptaPlanner properties
########################

# Tiempo de ejecución del solver (30 segundos por defecto)
# Para 5 minutos usar "5m", para 2 horas usar "2h"
optaplanner.solver.termination.spent-limit=30s

# Para ajustar cuántos solvers ejecutar en paralelo
# optaplanner.solver-manager.parallel-solver-count=4

# Para aumentar el uso de núcleos de CPU por solver
# optaplanner.solver.move-thread-count=2

# Modo de depuración para detectar bugs (reduce el rendimiento)
# optaplanner.solver.environment-mode=FULL_ASSERT

# Nivel de logging de OptaPlanner (INFO, DEBUG, TRACE)
logging.level.org.optaplanner=INFO

########################
# Spring Boot properties
########################

# Puerto del servidor
server.port=8082

# Formato de logging más legible
logging.pattern.console=%d{HH:mm:ss.SSS} %clr(${LOG_LEVEL_PATTERN:%5p}) %blue([%-15.15t]) %m%n

########################
# Actuator properties
########################

# Exponer el endpoint de health para health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
